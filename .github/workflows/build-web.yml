name: Build RSDKv3 for WebAssembly

on:
  push:
    branches:
      - web
    paths:
      - "RSDKv3/**"
      - "dependencies/**"
      - "platforms/**"
      - ".github/workflows/build-web.yml"
      - "CMakeLists.txt"
  pull_request:
    branches:
      - web
  workflow_dispatch:

jobs:
  webassembly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: "emsdk-cache"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config zip

      - name: Download and prepare Ogg, Vorbis and Theora
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dependencies/web
          curl --retry 5 --retry-all-errors --retry-delay 2 -fL https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz -o /tmp/libogg.tar.gz
          curl --retry 5 --retry-all-errors --retry-delay 2 -fL https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz -o /tmp/libvorbis.tar.gz
          curl --retry 5 --retry-all-errors --retry-delay 2 -fL https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz -o /tmp/libtheora.tar.gz
          tar -xzf /tmp/libogg.tar.gz -C dependencies/web
          tar -xzf /tmp/libvorbis.tar.gz -C dependencies/web
          tar -xzf /tmp/libtheora.tar.gz -C dependencies/web
          mv dependencies/web/libogg-1.3.5 dependencies/web/libogg
          mv dependencies/web/libvorbis-1.3.7 dependencies/web/libvorbis
          mv dependencies/web/libtheora-1.1.1 dependencies/web/libtheora
          cp dependencies/android/config_types.h dependencies/web/libogg/include/ogg/config_types.h

          PREFIX="$GITHUB_WORKSPACE/dependencies/web/install"
          mkdir -p "$PREFIX"

          cd dependencies/web/libogg
          emconfigure ./configure --prefix="$PREFIX" --disable-shared --enable-static
          emmake make -j2
          emmake make install

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          cd "$GITHUB_WORKSPACE/dependencies/web/libvorbis"
          emconfigure ./configure --prefix="$PREFIX" --disable-shared --enable-static --with-ogg="$PREFIX"
          emmake make -j2
          emmake make install

          cd "$GITHUB_WORKSPACE/dependencies/web/libtheora"
          emconfigure ./configure --prefix="$PREFIX" --disable-shared --enable-static --disable-asm --disable-encode --disable-examples --disable-spec --disable-doc \
            --with-ogg="$PREFIX" \
            --with-vorbis="$PREFIX"
          emmake make -j2
          emmake make install

      - name: Configure WebAssembly build
        run: |
          emcmake cmake -S . -B build-web \
            -DPLATFORM=Web \
            -DRETRO_USE_HW_RENDER=OFF \
            -DRETRO_MOD_LOADER=ON \
            -DRETRO_DISABLE_PLUS=ON \
            -DCMAKE_BUILD_TYPE=Release \

      - name: Compile WebAssembly build
        run: cmake --build build-web --parallel 2

      - name: Package downloadable browser build
        run: |
          cat > build-web/README-Web.txt <<'EOF'
          RSDKv3 WebAssembly build
          ========================

          This ZIP contains the browser build files. Keep the HTML, JavaScript,
          and WebAssembly files together in the same folder.

          Select your legally obtained Data.rsdk using the in-game file picker.
          The browser stores the selected data and save files in local browser
          storage for this browser profile.

          This is an experimental build. Browser security rules may prevent
          opening the HTML directly from file://. If that happens, the files
          need to be opened from a local or HTTPS origin. Do not move or rename
          the companion JavaScript or WebAssembly files.
          EOF
          cd build-web
          zip -9 RSDKv3-Web.zip RSDKv3.html RSDKv3.js RSDKv3.wasm README-Web.txt

      - name: Upload downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: rsdkv3-webassembly
          path: build-web/RSDKv3-Web.zip
          if-no-files-found: error
