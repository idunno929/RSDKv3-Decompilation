name: Build RSDKv3 for WebAssembly

on:
  push:
    branches:
      - web
    paths:
      - "RSDKv3/**"
      - "dependencies/**"
      - "platforms/**"
      - ".github/workflows/build-web.yml"
      - "CMakeLists.txt"
  pull_request:
    branches:
      - web
  workflow_dispatch:

jobs:
  webassembly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: "emsdk-cache"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Download and prepare Ogg, Vorbis and Theora
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dependencies/web
          curl -fL https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz -o /tmp/libogg.tar.gz
          curl -fL https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz -o /tmp/libvorbis.tar.gz
          curl -fL https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz -o /tmp/libtheora.tar.gz
          tar -xzf /tmp/libogg.tar.gz -C dependencies/web
          tar -xzf /tmp/libvorbis.tar.gz -C dependencies/web
          tar -xzf /tmp/libtheora.tar.gz -C dependencies/web
          mv dependencies/web/libogg-1.3.5 dependencies/web/libogg
          mv dependencies/web/libvorbis-1.3.7 dependencies/web/libvorbis
          mv dependencies/web/libtheora-1.1.1 dependencies/web/libtheora
          cp dependencies/android/config_types.h dependencies/web/libogg/include/ogg/config_types.h

          PREFIX="$GITHUB_WORKSPACE/dependencies/web/install"
          mkdir -p "$PREFIX"

          cd dependencies/web/libogg
          emconfigure ./configure --prefix="$PREFIX" --disable-shared --enable-static
          emmake make -j2
          emmake make install

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          cd "$GITHUB_WORKSPACE/dependencies/web/libvorbis"
          emconfigure ./configure --prefix="$PREFIX" --disable-shared --enable-static --with-ogg="$PREFIX"
          emmake make -j2
          emmake make install

          cd "$GITHUB_WORKSPACE/dependencies/web/libtheora"
          # Theora 1.1.1's x86/MMX assembly cannot be assembled for WebAssembly.
          # Keep the portable C decoder and disable only architecture-specific optimizations.
          emconfigure ./configure --prefix="$PREFIX" --disable-shared --enable-static --disable-asm --disable-encode --disable-examples --disable-spec --disable-doc \
            --with-ogg="$PREFIX" \
            --with-vorbis="$PREFIX"
          emmake make -j2
          emmake make install

      - name: Configure WebAssembly build
        run: |
          emcmake cmake -S . -B build-web \
            -DPLATFORM=Web \
            -DRETRO_USE_HW_RENDER=OFF \
            -DRETRO_MOD_LOADER=ON \
            -DRETRO_DISABLE_PLUS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-pthread" \
            -DCMAKE_CXX_FLAGS="-pthread"

      - name: Compile WebAssembly build
        run: cmake --build build-web --parallel 2

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: rsdkv3-webassembly
          path: |
            build-web/*.html
            build-web/*.js
            build-web/*.wasm
            build-web/*.data
          if-no-files-found: error
